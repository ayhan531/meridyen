# Meridyen Yatırım — Render TEK Web Service (API + web aynı serviste) + kalıcı disk.
# Not: kalıcı disk ücretli plan (Starter ve üstü) ister; ayrıca bir Render PostgreSQL oluşturup DATABASE_URL olarak bağlayın.
databases:
  - name: meridyen-db
    plan: free
    region: frankfurt
    databaseName: meridyen
    user: meridyen

services:
  - type: web
    name: meridyen
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz
    disk:
      name: meridyen-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: meridyen-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: SMS_MODE
        value: screen
      - key: ADMIN_TC
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SEED_TEST_USER
        value: "false"
      - key: REQUIRE_LIVE_MARKET_FOR_TRADING
        value: "1"
      - key: ALLOW_PRICE_SIMULATION
        value: "0"
      - key: RENDER_API_TOKEN
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
